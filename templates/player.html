<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{{ title }}</title>
    {{ apge_head() }}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="phone">
    <header id="me"></header>

    <section id="join" class="apge-screen">
        <h1 class="logo">{{ title }}</h1>
        <p>Pick a name (15 letters max).</p>
        <div id="join-form"></div>
    </section>

    <!-- The drawing pad lives outside #screen so re-renders never wipe a half-drawn head -->
    <section id="draw" class="apge-screen">
        <h2>Draw your head</h2>
        <p class="dim">Your body is a stick figure. Make the head count.</p>
        <div id="pad"></div>
        <button class="apge-button wide" id="head-done">Done drawing</button>
    </section>

    <section id="screen" class="apge-screen"></section>

    <!-- Overlays: Psst bubble, Shady Koala, loansharks -->
    <div id="overlay"></div>

    <script src="{{ url_for('static', filename='pixelart.js') }}"></script>
    <script src="{{ url_for('static', filename='common.js') }}"></script>
    <script src="{{ url_for('static', filename='player.js') }}"></script>
</body>
</html>
